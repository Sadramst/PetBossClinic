<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="scrubsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />
  
  <!-- Subtle Medical Cross in Background -->
  <g opacity="0.08" fill="#d4af37">
    <rect x="180" y="80" width="40" height="120" rx="8" />
    <rect x="140" y="120" width="120" height="40" rx="8" />
  </g>

  <!-- Doctor Silhouette / Icon -->
  <!-- Body/Scrubs -->
  <path d="M100 360 C100 280, 150 250, 200 250 C250 250, 300 280, 300 360 Z" fill="url(#scrubsGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Scrubs V-Neck -->
  <path d="M175 250 L200 295 L225 250" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Head -->
  <circle cx="200" cy="180" r="55" fill="#292524" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Stethoscope around neck -->
  <path d="M165 240 C165 310, 235 310, 235 240" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" />
  <circle cx="200" cy="320" r="14" fill="#1c1917" stroke="#d4af37" stroke-width="3" />
  <circle cx="200" cy="320" r="6" fill="#d4af37" />

  <!-- Lion Crown / Pet Boss Emblem Badge at top -->
  <g transform="translate(180, 35) scale(0.8)">
    <path d="M25 5 L35 25 L45 10 L40 35 L10 35 L5 10 L15 25 Z" fill="url(#goldGrad)" />
  </g>
</svg>
