name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: petboss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - 
      with:
        
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    
    - run: npm install
    - run: npm run typecheck
    - run: npm run lint
    
    - name: Run Tests
      env:
        DATABASE_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
      run: |
        npx prisma db push
        npm run test
