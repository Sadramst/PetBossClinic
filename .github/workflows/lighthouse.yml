name: Lighthouse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: petboss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Database push & seed
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
          DIRECT_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
          DIRECT_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          DATABASE_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
          DIRECT_URL: "postgresql://user:password@localhost:5432/petboss?schema=public"
